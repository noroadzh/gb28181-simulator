schema: spec-driven

context: |
  # GB28181 Simulator — 项目背景与技术约束(2026-09-23 确定)

  # 项目定位
  伪装成真实 GB/T 28181 网关的模拟器。以"节点(Node)"为基本单位组织内部实体,
  每个节点可独立配置为 上级平台 / 小平台(下级平台) / IPC / NVR 中任意一种身份,
  节点之间、节点与真实平台/设备之间可构成任意拓扑。媒体源(本地文件/RTSP/HLS/合成图)
  经转封装后以 RTP-PS / GB-PS 形式注入信令流,与真实国标平台/设备无差异互通。

  # 协议版本与互操作
  - 必须同时支持 GB/T 28181-2016 与 GB/T 28181-2022,使用 X-GB-Ver 头协商
  - 2022 增量能力(PTZ精确位置、看守位、巡航轨迹、软件升级、图像抓拍、
    H.265/AAC/G.722.1)作为可启用模块,按需在 SDP/能力集中声明
  - 附录覆盖: D(TCP媒体传输) H(摄像机路径选择) I(协议版本标识) O(采集部位类型)
  - MANSCDP+ XML 解析兼容 GB2312 / GBK / GB18030 / UTF-8
  - 国标设备 ID 与通道 ID 严格遵守 20 位编码规则

  # 节点模型(核心架构,取代旧的"上下级"二元)
  模拟器不以固定角色分类,而以 Node 为单位。Node 是完整可独立配置的国标实体,
  可在一台进程内任意实例化。三种身份:
  - device         : IPC/NVR/DVR,UAC 角色(注册、心跳、响应控制、响应拉流)
  - platform-small : 小/边缘平台,UAC 角色 + 主动 INVITE + 主动 SUBSCRIBE
                     + 主动 OPTIONS 保活 + MediaStatus 上报(级联拉流场景)
  - platform-large : 大/中心平台,UAS 角色(接收注册、主动 INVITE/SUBSCRIBE/MESSAGE)
  节点身份是配置属性,不是代码类型。同一代码基可扮演任何身份。
  任意拓扑必须支持: 一设备多主(注册到多个真实平台)、多虚拟下级批量注册(压测)、
  多虚拟上级实例(多 SIP 监听端口/多设备表)、多级级联(A→B→C,B 兼 UAC+UAS)。
  节点生命周期: 未启动/启动中/等待注册/已注册/运行中/暂停/异常退出,可单独启停。

  # 完整接口对齐(全量, 非最小集)
  SIP 方法全集: REGISTER(401挑战/过期重注册) INVITE(实时点播/语音对讲/历史回放/
  下载/升级) ACK(含 speculative ACK) BYE(含级联清理)
  SUBSCRIBE(目录/报警/移动位置/PTZ精准位置) NOTIFY(目录变更/报警/移动位置)
  MESSAGE(心跳/控制/查询/配置/通知) OPTIONS(保活) INFO(2022 MediaStatus 通知,
  MANSRTSP-style body) CANCEL 1xx/2xx/4xx/5xx/6xx 全部可主动生成。
  异常流覆盖: 401/403/404/407/408/480/486/487/488/500/503、CANCEL、re-INVITE、
  注册过期重注册、SIP 重传、Via branch 唯一性、半断/端口劫持/心跳超时/TLS 握手失败。
  特殊头部: Date、Note(nonce+algorithm=SM3)、X-GB-Ver(附录I)、
  X-RoutePath/X-PreferredPath(附录H.3)、SecurityInfo(VKEK 信封)。

  # 级联与平台转发
  - 平台可代为查询下级目录(X-RoutePath/X-PreferredPath 处理)
  - 平台可转发 INVITE 到下级目标设备(级联拉流)
  - 目录聚合 + 设备 ID 改写(OriginDeviceID 防回环)
  - 多级路径发现(附录 H.3)

  # 可裁剪场景包
  - 档位: 基础(注册/心跳/目录/实时点播) 标准(+控制/回放下载/报警)
    完整(+移动位置/2022增量/GB35114/级联/全部异常流) 自定义(YAML 指令清单)
  - 测试场景用 YAML 描述(YAML-driven scenarios),自动跑通并产出报告

  # 安全能力(默认开启)
  - GB35114 A 级: SM2 互认证 + SM3 Note 完整性,默认开启
  - GB/T 28181 标准 Digest(qop=auth)必须支持
  - SDP 协商中可声明 SRTP / TLS 信令与媒体加密
  - SM2/SM3 实现: github.com/emmansun/gmsm(纯 Go 无 CGO)

  # 媒体源(统一抽象 MediaSource, 四种全支持)
  - 本地 mp4/ts/mkv 文件循环      : 自研 demuxer + PS 复用器
  - RTSP 拉流(第三方 URL)        : github.com/bluenviron/gortsplib/v3
  - HLS 拉流(m3u8 + ts 切片)      : github.com/bluenviron/m3u8 + 自研 ts demuxer
  - 合成测试图(彩条/时钟/滚动文本/网格): image + golang.org/x/image/font

  # 媒体转封装(核心)
  MediaSource -> ES(H.264/H.265 NALU、AAC frame、G.711 sample) -> PS Multiplexer
  (视频 H.264=0x1B / H.265=0x24;音频 G.711A=0x90 / G.711μ=0x91 / G.722.1=0x92 /
  AAC=0x0F / SVAC=0x9B;私有流扩展 GB28181 §C.2) -> RTP Packetizer
  (AU>60KB 自动分割、marker bit、序列号/时间戳递增) -> Transport(UDP/TCP/TCP-passive/TLS)。
  主/被动模式均支持: 被动=收到 200 OK 后推流; 主动=SDP a=setup:active 向上级 SSRC 推流。

  # 高级仿真能力(全部需要)
  - 设备动态上下线、目录推送、报警订阅与上报(移动侦测/视频遮挡/视频丢失)、手动触发报警
  - 录像存储(指定本地目录为后端) + 录像查询(时间/通道/类型/报警源)
    + 历史回放(倍速控制) + 下载接口
  - 移动位置: SUBSCRIBE/NOTIFY、轨迹导入(GPX/CSV/模拟路径)、随机路径、定点
  - 2022 高级: 存储卡状态、巡航轨迹列表、云台看守位、PTZ 精准位置、
    设备软件升级、图像抓拍(含回传)

  # Web 管理后台
  - 后端 HTTP: github.com/labstack/echo/v4; WebSocket: github.com/gorilla/websocket
  - 前端: Vue3 + Element Plus + Vite,构建产物经 embed.FS 嵌入二进制,单文件分发
  - 实时推送: 分级日志、设备上下线、媒体流状态、报警事件
  - 页面: 节点列表(身份/状态/连接/会话,单节点启停) 通道 会话 抓包(SIP原文+SDP+RTP
    hexdump,实时刷新,pcap 导出) 日志(trace/debug/info/warn/error 过滤+导出)
    系统(配置导入导出/平台/安全) 场景(预设一键启用) 测试(YAML 场景报告)

  # 日志
  - 基于 log/slog(Go 1.21+ 标准库)自定义 Handler
  - 级别: trace(SIP wire bytes 原文) / debug(流程) / info(关键业务事件)
    / warn(可恢复异常) / error(致命错误)
  - 输出: 文件 + WebSocket 推送前端 + 可选 syslog;支持按节点过滤
  - 敏感字段(密码、SM2 私钥)自动脱敏

  # 配置与持久化
  - 配置: github.com/spf13/viper,YAML 主,支持环境变量覆盖
  - 配置结构以"节点"为单位组织
  - 持久化: modernc.org/sqlite(纯 Go 无 CGO): 节点配置、设备/通道、会话历史、
    报警事件流水、配置变更审计
  - 配置与日志目录遵循 XDG(Linux/macOS) / %AppData%(Windows)

  # 技术栈速览
  Go 1.22+ 纯 Go 无 CGO; SIP: github.com/ghettovoice/gosip; RTSP: bluenviron/gortsplib/v3;
  HLS: bluenviron/m3u8; SM2/SM3: emmansun/gmsm; HTTP: labstack/echo/v4;
  WS: gorilla/websocket; 配置: spf13/viper; 存储: modernc.org/sqlite;
  日志: log/slog; 抓包导出: google/gopacket; 前端: Vue3 + Element Plus + Vite

  # CI / 跨平台
  - 目标: Linux amd64/arm64, macOS amd64/arm64, Windows amd64
  - GitHub Actions: lint(golangci-lint) + unit test(含字节级 golden test)
    + build matrix(4 平台) + tag release 自动产出二进制与 sha256

  # 路线图(每 change 独立可交付, 按此顺序推进)
  # 1  init-project-skeleton      : 仓库结构+依赖+CI+logger+HTTP骨架+Web嵌入(第一阶段终点)
  # 2  core-sip-stack             : SIP 消息收发、SDP 编解码、Digest 认证(节点无关底层)
  # 3  core-manscdp-and-ps        : MANSCDP+ XML、PS 封装/解封装、RTP 分包
  # 4  node-abstraction           : Node 模型(身份/状态机/实例化/多节点共存)
  # 5  device-node                : device 身份完整实现
  # 6  platform-large-node        : platform-large 身份完整实现
  # 7  platform-small-node        : platform-small 身份完整实现
  # 8  media-sources              : 四种媒体源统一抽象 + 转封装管道
  # 9  cascade-and-multi-instance : 级联路径 + 任意拓扑演练
  # 10 dynamic-sim-features       : 动态目录/报警、录像与回放、移动位置
  # 11 gb28181-2022-extensions    : 2022 增量能力 + X-GB-Ver 协商
  # 12 gb35114-security           : SM2 互认证 + SM3 Note 完整性
  # 13 exception-and-capture      : 异常流 + 抓包 + pcap 导出
  # 14 web-management-ui          : Web 界面完整功能
  # 15 scenario-engine            : YAML-driven 场景脚本引擎 + 报告产出

  # 重要约束
  - 第一阶段(Change 1)仅交付项目骨架 + Web 空壳,不实现任何协议细节
  - 后续 change 必须复用本 context 中的技术选型与命名,不得擅自替换
  - 中文注释/文档允许,但 spec、任务标识符使用英文
  - 不引入需要 CGO 的依赖

rules:
  proposal:
    - 任何 change 的 proposal 必须明确指出对应路线图阶段编号
    - 必须列出 Non-goals,显式排除不属于本阶段的 GB28181 能力
  tasks:
    - 任务粒度 ≤ 2 小时,每任务含明确的验收标准
    - 涉及 SIP/SDP/PS 字节格式的任务必须包含 golden test(字节级断言)

operations:
  apply:
    guidance:
      - 每次提交必须包含单元测试或 golden test,不允许只写实现
      - 跨平台相关的 system call 必须在 Linux/macOS/Windows 三平台验证
  archive:
    guidance:
      - archive 前必须执行 verify-change,并在总结中引用验证结论