# Default configuration for gb28181-simulator (Change 1).
# All keys fall back to sensible defaults when omitted; the file is
# optional. Environment variables override values here
# (e.g. GB28181_SIMULATOR_HTTP_PORT=19090).

http:
  host: 127.0.0.1
  port: 18080

log:
  level: info             # trace|debug|info|warn|error
  file: ""                # default: $XDG_STATE_HOME/.../logs/app.log
  add_source: false       # attach file:line to each record
  redact_keys:
    - password
    - authorization
  # modules:              # optional per-module level overrides (longest prefix wins)
  #   # production (level: info) — leave commented to inherit info
  #   # "internal/app/sip_acceptor": warn
  #   # "internal/adapter/cascade": warn
  #   # "internal/adapter/capture": warn
  #   # staging (level: debug) — set selectively for the noisy subsystems only
  #   # "internal/app": debug
  #   # "internal/adapter/cascade": debug
  #   # "internal/adapter/capture": debug
  #   # test (level: trace) — set a single subsystem to trace to keep the log readable
  #   # "internal/app/sip_acceptor": trace

storage:
  path: ""                # default: $XDG_STATE_HOME/.../data.db

# Wire capture (Change 13). When enabled, SIP traffic is buffered per node
# for the HTTP capture endpoint and pcap export. Disable to skip the
# allocation cost on long-running deployments.
capture:
  enabled: true
  capacity: 2048          # per-node ring size; 0 falls back to the adapter default

tracing:
  enabled: true           # stdout exporter; set false to use a no-op tracer
  sample_ratio: 1.0       # 0.0..1.0; 1.0 samples everything (dev), 0.01 default
  otlp_endpoint: ""       # host:port for OTLP gRPC; empty = stdout only
  service_name: ""        # defaults to "gb28181-simulator"

# Optional node inventory (Change 4). Omit the whole section to run with zero
# nodes — then behaviour is identical to Change 3.
#
# Every entry is mandatory except vendor:
#   id     20 digits: 8 centre + 2 industry + 3 type + 1 network + 6 serial.
#          The 3-digit type code decides the kind (131/132/... device,
#          200 platform-large, 216 platform-small).
#   kind   device | platform-large | platform-small
#   domain home domain the node registers against
#   addr   signalling address the node listens on; must be unique per node —
#          a duplicate is rejected at load time with the incumbent node id.
#
# An illegal entry (bad id length, unknown kind) fails config loading rather
# than being skipped silently, so the process never starts with fewer nodes
# than configured.
nodes:
  - id: "34020000011310000001"
    kind: device
    domain: "3402000000"
    addr: "127.0.0.1:15060"
    vendor: acme
    # Optional. Present means "register on start": the node sends REGISTER
    # to the platform, answers its 401 challenge and only then goes online.
    # Omit the whole block to keep the node unregistered.
    registration:
      server: "127.0.0.1:15061"   # host:port of the upstream platform
      server_id: "34020000002000000001"  # optional; used in the Request-URI
      # username: "34020000011310000001" # optional; defaults to the node id
      password: "change-me"              # never logged (see log.redact_keys)
      # allow_no_auth: true              # 设为 true 时 password 可为空，发送空 response
    # 无密码模式示例（内网/测试）：
    # registration:
    #   server: "127.0.0.1:15061"
    #   password: ""                    # 空密码
    #   allow_no_auth: true             # 启用无密码模式
      expires: 3600                      # optional; seconds, default 3600
      transport: udp                     # optional; udp (default) or tcp
      timeout: 5s                        # optional; default 5s
      # Holding the registration open (all optional):
      heartbeat_interval: 60s            # MESSAGE keepalive period, default 60s
      heartbeat_timeout: 5s              # wait for its answer, default 5s;
                                         # must be shorter than the interval
      heartbeat_max_failures: 3          # unanswered beats tolerated before
                                         # the node falls back to fault
    # 媒体源（Change 19）。device 节点才需要；platform 节点忽略此段。
    # kind: synthetic | file | rtsp | hls
    #   synthetic: 程序生成动态条纹图，无需外部文件（推荐用于快速测试）
    #   file:     播放本地 PS/H.264 文件，支持 loop
    #   rtsp:     从 RTSP 流拉取（需网络可达）
    #   hls:      从 HLS m3u8 播放列表拉取
    # path: 对于 file/rtsp/hls 必填；synthetic 可省略
    # loop: 仅 kind=file 有效；true 则文件播完后从头重播
    # fps: 每秒帧率；synthetic 必填，file 可省略（默认 25）
    # mtu: RTP 包最大负载字节数；默认 1400
    # ssrc: RTP SSRC 标识符；0 表示自动生成
    # clock: RTP 时钟频率（Hz）；默认 90000
    # media:
    #   kind: synthetic
    #   fps: 25
    #   mtu: 1400
    #   ssrc: 0
    #   clock: 90000
    # 示例（本地文件循环播放）：
    # media:
    #   kind: file
    #   path: /path/to/video.ps
    #   loop: true
    #   fps: 25
    #   mtu: 1400
  - id: "34020000012000000001"
    kind: platform-large
    domain: "3402000000"
    addr: "127.0.0.1:15061"
    vendor: acme
    # Optional. Present means "serve the downstreams below": the node
    # answers REGISTER with a 401 Digest challenge, checks the answer
    # against these accounts and grants a lifetime inside the window.
    # Omit the whole block and the node still serves — in its own domain,
    # with the default window, and with no account accepted.
    platform:
      realm: "3402000000"                # optional; defaults to the domain
      accounts:                          # optional; passwords are never logged
        - username: "34020000011310000001"
          password: "change-me"
        # The platform-small below registers here too, so it needs an
        # account of its own on this platform.
        - username: "34020000002160000001"
          password: "change-me"
      min_expires: 60                    # optional; default 60
      default_expires: 3600              # optional; default 3600
      max_expires: 86400                 # optional; default 86400
    # 无密码模式示例（内网/测试）：允许 password 为空，跳过 Digest 校验
    # allow_no_auth: true
    # accounts:
    #   - username: "34020000011310000001"
    #     password: ""
  # A platform-small is the link in the middle of a cascade: it declares both
  # halves, and each half is optional on its own. `platform:` is how it serves
  # the downstreams below it, exactly as a platform-large does;
  # `registration:` is how it registers with the upstream above it, exactly as
  # a device does. Declare both and the node relays:
  # device → platform-small → platform-large. Declare only `platform:` and it
  # is a platform that answers to nobody above it; declare only
  # `registration:` and it still serves — with the defaults — while being
  # somebody's subordinate.
  - id: "34020000002160000001"
    kind: platform-small
    domain: "3402000000"
    addr: "127.0.0.1:15062"
    vendor: acme
    platform:
      realm: "3402000000"
      accounts:
        # A device that registers with this platform instead of with the
        # platform-large above.
        - username: "34020000011310000002"
          password: "change-me"
      min_expires: 60
      default_expires: 3600
      max_expires: 86400
    registration:
      server: "127.0.0.1:15061"          # the platform-large above
      server_id: "34020000002000000001"
      password: "change-me"
      expires: 3600
      transport: udp
      timeout: 5s
      heartbeat_interval: 60s
      heartbeat_timeout: 5s
      heartbeat_max_failures: 3