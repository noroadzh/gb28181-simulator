# gb28181-simulator — 单实例多角色（默认）
#
# 一个容器 = 一套 Web UI（顶栏 全部/平台/设备）+ 同进程 platform + device。
# 配置：configs/examples/compose-single.yaml
#
#   docker compose up -d --build
#   open http://127.0.0.1:18080
#
# 若仍需「两容器各跑一种角色」，见 docker-compose.dual.yml。

name: gb28181-simulator

services:
  gbsim:
    build:
      context: .
      args:
        VERSION: compose-dev
        COMMIT: compose-dev
        BUILT_AT: compose-dev
    image: gb28181-simulator:compose-dev
    container_name: gbsim
    hostname: gbsim
    restart: unless-stopped
    ports:
      - "15060:5060/udp"   # 平台 SIP（对外对接入口）
      - "15060:5060/tcp"
      - "15061:5061/udp"   # 设备 SIP（同进程内注册用；可选对外）
      - "15061:5061/tcp"
      - "18080:8080/tcp"   # 唯一 Web UI + REST API
    volumes:
      - ./configs/examples/compose-single.yaml:/etc/gb28181-simulator/config.yaml:ro
      - gbsim-data:/var/lib/gb28181-simulator
    networks:
      gbsim-net:
        ipv4_address: 172.26.0.2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

networks:
  gbsim-net:
    driver: bridge
    name: gbsim-net
    ipam:
      config:
        - subnet: 172.26.0.0/16
          gateway: 172.26.0.1

volumes:
  gbsim-data:
