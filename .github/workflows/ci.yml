name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '22'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # v2 系列工具链（Go 1.25+ 编译）。@v8 action 默认拉取 v2 二进制；
          # pin 到 v2.6.x 避免 latest 在 Go 1.25 RC 阶段被切到不兼容快照。
          version: v2.6.0

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build web assets
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build
      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ runner.os }}
          path: coverage.out

  build:
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, os: ubuntu-24.04, ext: '' }
          - { goos: linux, goarch: arm64, os: ubuntu-24.04, ext: '' }
          - { goos: darwin, goarch: amd64, os: macos-latest, ext: '' }
          - { goos: darwin, goarch: arm64, os: macos-latest, ext: '' }
          - { goos: windows, goarch: amd64, os: windows-latest, ext: '.exe' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build web assets
        run: |
          cd web
          npm ci --no-audit --no-fund
          npm run build
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          RUN_DATE: ${{ github.event.repository.updated_at }}
        run: |
          mkdir -p out
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA} -X main.builtAt=${RUN_DATE}" -o out/gb28181-simulator-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/gb28181-simulator
      - name: Checksum
        run: |
          cd out
          for f in gb28181-simulator-*; do
            sha256sum "$f" > "$f.sha256" || shasum -a 256 "$f" > "$f.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gb28181-simulator-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/
          if-no-files-found: error

  # Change: fix-problems-and-smoke-deploy-docs, task 4.1.
  # One-command smoke baseline for the gb28181-simulator. Produces the
  # docs/smoke-results.json artifact uploaded below and gates the release
  # pipeline on a green run.
  smoke:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Run make smoke
        run: bash scripts/smoke.sh
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: docs/smoke-results.json
          if-no-files-found: warn
      - name: Upload cross-platform binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-binaries
          path: build/
          if-no-files-found: warn