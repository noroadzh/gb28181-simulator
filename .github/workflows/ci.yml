name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build web assets
        run: |
          cd web
          npm install --no-audit --no-fund
          npm run build
      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Upload coverage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ runner.os }}
          path: coverage.out

  build:
    needs: [lint, test]
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, os: ubuntu-latest, ext: '' }
          - { goos: linux, goarch: arm64, os: ubuntu-latest, ext: '' }
          - { goos: darwin, goarch: amd64, os: macos-latest, ext: '' }
          - { goos: darwin, goarch: arm64, os: macos-latest, ext: '' }
          - { goos: windows, goarch: amd64, os: windows-latest, ext: '.exe' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build web assets
        run: |
          cd web
          npm install --no-audit --no-fund
          npm run build
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p out
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA} -X main.builtAt=${RUN_DATE}" -o out/gb28181-simulator-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/gb28181-simulator
      - name: Checksum
        run: |
          cd out
          for f in gb28181-simulator-*; do
            sha256sum "$f" > "$f.sha256" || shasum -a 256 "$f" > "$f.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gb28181-simulator-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/
          if-no-files-found: error
env:
  RUN_DATE: ${{ github.event.repository.updated_at }}